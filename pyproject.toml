[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-52w-high-low-breadth"
version = "0.1.0"
description = "NSE daily market breadth, Advance/Decline ratio, TRIN Arms index, and 52-week high/low tracker"
authors = [{ name = "Prathmesh Gupta" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0"
]

[tool.setuptools.packages.find]
where = ["src"]
